name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Verify release version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run check

      - name: Build manual installation archive
        run: node scripts/release-assets.mjs archive --version "$GITHUB_REF_NAME"

      - name: Verify pushed release tag identity
        shell: bash
        run: |
          verify_release_tag_identity() {
            local expected_commit checkout_commit tag_ref remote_refs remote_commit
            local -a tag_objects peeled_commits

            expected_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            checkout_commit="$(git rev-parse "HEAD^{commit}")"
            tag_ref="refs/tags/${GITHUB_REF_NAME}"

            if [[ "$checkout_commit" != "$expected_commit" ]]; then
              echo "The checked-out commit no longer matches the release event commit." >&2
              exit 1
            fi

            if ! remote_refs="$(
              git ls-remote --exit-code origin "$tag_ref" "${tag_ref}^{}"
            )"; then
              echo "Could not resolve the pushed release tag from origin." >&2
              exit 1
            fi

            mapfile -t tag_objects < <(
              awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<< "$remote_refs"
            )
            mapfile -t peeled_commits < <(
              awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }' <<< "$remote_refs"
            )

            if [[ "${#tag_objects[@]}" -ne 1 || "${#peeled_commits[@]}" -gt 1 ]]; then
              echo "The remote release tag did not resolve to one unambiguous object." >&2
              exit 1
            fi

            remote_commit="${tag_objects[0]}"
            if [[ "${#peeled_commits[@]}" -eq 1 ]]; then
              remote_commit="${peeled_commits[0]}"
            fi

            if [[ "$remote_commit" != "$expected_commit" ]]; then
              echo "The remote release tag no longer points to the pushed event commit." >&2
              exit 1
            fi
          }

          verify_release_tag_identity

      - name: Check existing immutable Release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_response="$RUNNER_TEMP/tagged-release.json"
          release_status="$(
            curl --silent --show-error \
              --output "$release_response" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          )"

          case "$release_status" in
            "200")
              if ! jq --exit-status '.immutable == true and .draft == false' "$release_response" >/dev/null; then
                echo "The tagged Release exists but is not immutable; publish a new version." >&2
                exit 1
              fi

              archive_name="property-order-${GITHUB_REF_NAME}.zip"
              if ! jq --exit-status --arg archive_name "$archive_name" '
                (.assets | type == "array") and
                ([.assets[].name] | sort) ==
                  (["main.js", "manifest.json", "styles.css", $archive_name] | sort) and
                ([.assets[].name] | unique | length) == 4
              ' "$release_response" >/dev/null; then
                echo "The tagged Release asset inventory is not exactly the four expected files; publish a new version." >&2
                exit 1
              fi

              existing_assets="$RUNNER_TEMP/existing-release-assets"
              mkdir -p "$existing_assets"
              gh release download "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$existing_assets" \
                --pattern main.js \
                --pattern manifest.json \
                --pattern styles.css \
                --pattern "property-order-${GITHUB_REF_NAME}.zip"
              node scripts/release-assets.mjs compare \
                --version "$GITHUB_REF_NAME" \
                --local-dir dist \
                --existing-dir "$existing_assets"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            "404")
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not query the tagged Release (HTTP ${release_status})." >&2
              exit 1
              ;;
          esac

      - name: Attest Obsidian release assets
        if: steps.release_state.outputs.exists != 'true'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/property-order-${{ github.ref_name }}.zip

      - name: Publish immutable GitHub release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          verify_release_assets() {
            local expected_draft="$1" expected_immutable="$2" stage="$3" assets_directory="$4"
            local archive_name release_response release_status

            archive_name="property-order-${GITHUB_REF_NAME}.zip"
            release_response="$RUNNER_TEMP/${stage}-release.json"
            release_status="$(
              curl --silent --show-error \
                --output "$release_response" \
                --write-out "%{http_code}" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2026-03-10" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
            )"

            if [[ "$release_status" != "200" ]]; then
              echo "::error title=Release supply-chain verification failed::${stage}: tagged Release query returned HTTP ${release_status}." >&2
              return 1
            fi

            if ! jq --exit-status \
              --arg archive_name "$archive_name" \
              --argjson expected_draft "$expected_draft" \
              --argjson expected_immutable "$expected_immutable" '
                .draft == $expected_draft and
                .immutable == $expected_immutable and
                (.assets | type == "array") and
                ([.assets[].name] | sort) ==
                  (["main.js", "manifest.json", "styles.css", $archive_name] | sort) and
                ([.assets[].name] | unique | length) == 4
              ' "$release_response" >/dev/null; then
              echo "::error title=Release supply-chain verification failed::${stage}: Release state or asset inventory is not the exact expected immutable contract." >&2
              return 1
            fi

            mkdir "$assets_directory"
            if ! gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$assets_directory" \
              --pattern main.js \
              --pattern manifest.json \
              --pattern styles.css \
              --pattern "$archive_name"; then
              echo "::error title=Release supply-chain verification failed::${stage}: could not download the exact remote asset set." >&2
              return 1
            fi

            if ! node scripts/release-assets.mjs compare \
              --version "$GITHUB_REF_NAME" \
              --local-dir dist \
              --existing-dir "$assets_directory"; then
              echo "::error title=Release supply-chain verification failed::${stage}: remote asset SHA-256 values differ from the candidate build." >&2
              return 1
            fi
          }

          verify_release_tag_identity() {
            local expected_commit checkout_commit tag_ref remote_refs remote_commit
            local -a tag_objects peeled_commits

            expected_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            checkout_commit="$(git rev-parse "HEAD^{commit}")"
            tag_ref="refs/tags/${GITHUB_REF_NAME}"

            if [[ "$checkout_commit" != "$expected_commit" ]]; then
              echo "The checked-out commit no longer matches the release event commit." >&2
              exit 1
            fi

            if ! remote_refs="$(
              git ls-remote --exit-code origin "$tag_ref" "${tag_ref}^{}"
            )"; then
              echo "Could not resolve the pushed release tag from origin." >&2
              exit 1
            fi

            mapfile -t tag_objects < <(
              awk -v ref="$tag_ref" '$2 == ref { print $1 }' <<< "$remote_refs"
            )
            mapfile -t peeled_commits < <(
              awk -v ref="${tag_ref}^{}" '$2 == ref { print $1 }' <<< "$remote_refs"
            )

            if [[ "${#tag_objects[@]}" -ne 1 || "${#peeled_commits[@]}" -gt 1 ]]; then
              echo "The remote release tag did not resolve to one unambiguous object." >&2
              exit 1
            fi

            remote_commit="${tag_objects[0]}"
            if [[ "${#peeled_commits[@]}" -eq 1 ]]; then
              remote_commit="${peeled_commits[0]}"
            fi

            if [[ "$remote_commit" != "$expected_commit" ]]; then
              echo "The remote release tag no longer points to the pushed event commit." >&2
              exit 1
            fi
          }

          assets=(
            dist/main.js
            dist/manifest.json
            dist/styles.css
            "dist/property-order-${GITHUB_REF_NAME}.zip"
          )
          verify_release_tag_identity
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          verify_release_tag_identity
          verify_release_assets \
            true false \
            "draft-pre-publish" \
            "$RUNNER_TEMP/draft-release-assets"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          verify_release_tag_identity
          verify_release_assets \
            false true \
            "published-post-publish" \
            "$RUNNER_TEMP/published-release-assets"

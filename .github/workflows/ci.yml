name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Verify runtime contract
        run: npm run check:runtime

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, build, and verify release assets
        run: npm run check

      - name: Run suggestion usage regression benchmark
        run: npm run bench:usage

      - name: Upload production plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: property-order-production
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error

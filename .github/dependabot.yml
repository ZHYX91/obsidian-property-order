version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # Major upgrades are deliberate maintenance work. This filter applies to
    # routine version updates; Dependabot security updates remain eligible.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
